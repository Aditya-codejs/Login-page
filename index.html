<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
</head>
<style>
    body{
        display: flex;
        justify-content : center ;
        background-color : black ;
        align-items : center;
        height : 100vh;

    }
    .login-box{
        position : relative;
        background  : white;
        height : 600px;
        width:1000px;
        border-radius: 16px; /* make the corner rounded */
        overflow: hidden; /* use here to make the radius as it is at the corner just */ 
    }
    .welcome-area{
        display: flex; /* this is necessary to use so the below two properties work*/
        align-items:centre;
        justify-content:centre;
        position :absolute;
        top:0;
        right:0;
        width:65%;
        height:100%;
        background :linear-gradient(135deg, #f52e0b, #f2fa09);  /* this is used to make a line inside the box  */
        clip-path : polygon(0 0, 100% 0, 100% 100%, 80% 100%);  /* here this command help the line to convert into diagnol */
        padding-left: 0.5%; /* this is use to increase or decrease the area of the specific selected area */
    }
    .welcome-area h1{
        margin-left: 50%; /* margin basically help to move the text */
        margin-top: 20%;
        font-size : 50px;
    }
    .form-area h1{
        font-size: 45px;
        margin-left: 13%;
        font-style:italic
    }
    .form-area h3{
        margin-left: 20%;
        margin-top: 40px;
        font-size: 20px;
        font-style:oblique;
    }
    .form-area h4{
        margin-left: 25%;
        font-size: 20px;
        font-style:oblique;
    }
    input{
        border:none; /* removes the line of border */
        border-bottom: 2px solid #ccc; /* use to add bottom border not box for username */
        border-radius: 0px; /* this is used to make the corner of the input box rounded */
        padding : 8px 4px; /* use to increase or decrease the length and height of input box */
        outline: none;
        background: tranparent;
        font-size: 15px;
        margin-left: 10%;
        margin-top: 4%;
        transition: 0.3s;
        width: 40%;
    } 
    input::placeholder{
        color : black;
    }
</style>
<body>
    <div class ="login-box">
        <div class = "welcome-area">
            <h1>WELCOME <br> Back! 😀</h1>
        </div>
        <div class ="form-area">
            <h1>Login</h1>
            <h2><input type="text" placeholder=" Enter Username"></h2>
            <h2><input type="password" placeholder=" Enter Password"></h2>
            <input type="submit" value="Login">
            <h3>Don't Have Account ?</h3>
            <h4><a href="signup.html">Sign Up</a></h4>
        </div>
    </div>
</body>
</html>
