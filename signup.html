<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up Page</title>
</head>
<style>
    body{
        display: flex;
        justify-content : center ;
        background-color : black ;
        align-items : center;
        height : 100vh;

    }
    .login-box{
        position : relative;
        background  : white;
        height : 600px;
        width:1000px;
        border-radius: 16px; /* make the corner rounded */
        overflow: hidden; /* use here to make the radius as it is at the corner just */ 
    }
    .welcome-area{
        display: flex; /* this is necessary to use so the below two properties work*/
        align-items:centre;
        justify-content:centre;
        position :absolute;
        top:0;
        right:0;
        width:65%;
        height:100%;
        background :linear-gradient(135deg, #f52e0b, #f2fa09);  /* this is used to make a line inside the box  */
        clip-path : polygon(0 0, 100% 0, 100% 100%, 80% 100%);  /* here this command help the line to convert into diagnol */
        padding-left: 0.5%; /* this is use to increase or decrease the area of the specific selected area */
    }
</style>
<body>
    <div class="login-box">
        <div class ="welcome-area">
            <h1>WELCOME </h1>
        </div>
    </div>
</body>
</html>
